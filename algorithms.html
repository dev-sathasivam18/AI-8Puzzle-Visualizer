<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Algorithms | 8-Puzzle Visualizer</title>
  <meta name="description" content="Description, working principle, advantages, limitations and complexity of BFS, DFS, DLS, IDDLS, UCS, GBFS and A*.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="site-nav"></div>

  <main class="container-xl py-4">
    <h1 class="h3 mb-1">Algorithm information</h1>
    <p class="text-body-secondary">
      Notation: <b>b</b> branching factor (at most 4 for the 8-puzzle), <b>d</b> depth of the shallowest goal,
      <b>m</b> maximum depth of the state space, <b>l</b> depth limit, <b>C*</b> optimal solution cost, <b>e</b> smallest step cost.
    </p>

    <div class="card mb-4">
      <div class="card-header section">At a glance</div>
      <div class="table-responsive">
        <table class="table align-middle mb-0 complexity-table cmp-table">
          <thead>
            <tr><th>Algorithm</th><th>Type</th><th>Time</th><th>Space</th><th>Complete?</th><th>Optimal?</th></tr>
          </thead>
          <tbody id="complexityBody"></tbody>
        </table>
      </div>
    </div>

    <div class="accordion" id="algoAccordion"></div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/algorithms.js"></script>
</body>
</html>
